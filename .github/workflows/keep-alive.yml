name: Keep demo warm

# Render's free tier puts the API to sleep after ~15 minutes of inactivity, so
# the first visitor would wait ~50s. Pinging /health every 10 minutes avoids that.
# Note: GitHub pauses scheduled workflows after 60 days without repo activity.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API and site
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 \
            https://ai-ecom-backend-r7sm.onrender.com/health
          echo
          curl --fail --silent --show-error --max-time 30 -o /dev/null \
            -w "site: %{http_code}\n" https://ai-ecom-mocha.vercel.app/
